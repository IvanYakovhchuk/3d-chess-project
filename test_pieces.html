<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Three.js Mock with 2D and Outline Support</title>
</head>
<body>
  <div id="output">Running...</div>
  <script>
    // Lightweight mock of THREE.js to verify pieces3d.js in headless browser
    window.THREE = {
      Vector2: class {
        constructor(x = 0, y = 0) { this.x = x; this.y = y; }
      },
      Matrix4: class {
        set() { return this; }
      },
      BufferGeometry: class {
        computeVertexNormals() {}
        applyMatrix4() { return this; }
        translate() { return this; }
        rotateY() { return this; }
        rotateX() { return this; }
      },
      LatheGeometry: class {
        constructor(points, segments) {
          this.points = points;
          this.segments = segments;
        }
        computeVertexNormals() {}
      },
      SphereGeometry: class {
        constructor(radius, widthSegments, heightSegments) {
          this.radius = radius;
          this.widthSegments = widthSegments;
          this.heightSegments = heightSegments;
        }
        computeVertexNormals() {}
      },
      BoxGeometry: class {
        constructor(width, height, depth) {
          this.width = width;
          this.height = height;
          this.depth = depth;
        }
        computeVertexNormals() {}
      },
      ConeGeometry: class {
        constructor(radius, height, radialSegments) {
          this.radius = radius;
          this.height = height;
          this.radialSegments = radialSegments;
        }
        computeVertexNormals() {}
      },
      CylinderGeometry: class {
        constructor(topR, botR, height, segments) {
          this.topR = topR;
          this.botR = botR;
          this.height = height;
          this.segments = segments;
        }
        computeVertexNormals() {}
      },
      RingGeometry: class {
        constructor(innerR, outerR, segments) {
          this.innerR = innerR;
          this.outerR = outerR;
          this.segments = segments;
        }
        computeVertexNormals() {}
      },
      CircleGeometry: class {
        constructor(radius, segments) {
          this.radius = radius;
          this.segments = segments;
        }
        computeVertexNormals() {}
      },
      ExtrudeGeometry: class {
        constructor(shape, options) {
          this.shape = shape;
          this.options = options;
        }
        computeVertexNormals() {}
        applyMatrix4() { return this; }
        translate() { return this; }
      },
      Shape: class {
        constructor() { this.curves = []; }
        moveTo(x, y) { this.curves.push(['moveTo', x, y]); }
        lineTo(x, y) { this.curves.push(['lineTo', x, y]); }
        quadraticCurveTo(cx, cy, x, y) { this.curves.push(['quadraticCurveTo', cx, cy, x, y]); }
        bezierCurveTo(c1x, c1y, c2x, c2y, x, y) { this.curves.push(['bezierCurveTo', c1x, c1y, c2x, c2y, x, y]); }
        closePath() { this.curves.push(['closePath']); }
      },
      Mesh: class {
        constructor(geometry, material) {
          this.isMesh = true;
          this.geometry = geometry;
          this.material = material;
          this.position = { x: 0, y: 0, z: 0, set: function(x, y, z) { this.x = x; this.y = y; this.z = z; }, copy: function(p) { this.x = p.x; this.y = p.y; this.z = p.z; } };
          this.rotation = { x: 0, y: 0, z: 0, set: function(x, y, z) { this.x = x; this.y = y; this.z = z; }, copy: function(r) { this.x = r.x; this.y = r.y; this.z = r.z; } };
          this.scale = { x: 1, y: 1, z: 1, copy: function(s) { this.x = s.x; this.y = s.y; this.z = s.z; return this; }, multiplyScalar: function(m) { this.x *= m; this.y *= m; this.z *= m; return this; } };
          this.userData = {};
          this.castShadow = false;
          this.receiveShadow = false;
        }
      },
      Group: class {
        constructor() {
          this.isGroup = true;
          this.children = [];
          this.position = { x: 0, y: 0, z: 0, set: function(x, y, z) { this.x = x; this.y = y; this.z = z; } };
          this.rotation = { x: 0, y: 0, z: 0, set: function(x, y, z) { this.x = x; this.y = y; this.z = z; } };
          this.userData = {};
        }
        add(child) {
          this.children.push(child);
        }
        traverse(callback) {
          callback(this);
          for (const child of [...this.children]) {
            if (child.traverse) {
              child.traverse(callback);
            } else {
              callback(child);
            }
          }
        }
      },
      MeshPhysicalMaterial: class {
        constructor(params = {}) {
          this.isMaterial = true;
          this.color = { set: function(c) { this.value = c; } };
          Object.assign(this, params);
        }
      },
      MeshStandardMaterial: class {
        constructor(params = {}) {
          this.isMaterial = true;
          this.color = { set: function(c) { this.value = c; } };
          Object.assign(this, params);
        }
      },
      MeshBasicMaterial: class {
        constructor(params = {}) {
          this.isMaterial = true;
          this.color = { set: function(c) { this.value = c; } };
          Object.assign(this, params);
        }
      },
      CanvasTexture: class {
        constructor(canvas) {
          this.image = canvas;
          this.repeat = { x: 1, y: 1, set: function(x, y) { this.x = x; this.y = y; } };
        }
      },
      BackSide: 1,
      FrontSide: 0,
      DoubleSide: 2,
      RepeatWrapping: 1000
    };
  </script>
  <script src="pieces3d.js"></script>
  <script>
    const results = [];
    function assert(cond, msg) {
      if (!cond) {
        results.push('FAIL: ' + msg);
        throw new Error(msg);
      } else {
        results.push('PASS: ' + msg);
      }
    }

    try {
      assert(typeof window.ChessPieces3D === 'object', 'window.ChessPieces3D is defined');
      assert(typeof window.ChessPieces3D.createPieceMesh === 'function', 'createPieceMesh is function');
      assert(typeof window.ChessPieces3D.createPiece2DMesh === 'function', 'createPiece2DMesh is function');
      assert(typeof window.ChessPieces3D.getPieceHeight === 'function', 'getPieceHeight is function');
      assert(typeof window.ChessPieces3D.setTheme === 'function', 'setTheme is function');
      assert(typeof window.ChessPieces3D.setMode === 'function', 'setMode is function');
      assert(typeof window.ChessPieces3D.getMode === 'function', 'getMode is function');

      const pieceTypes = ['p', 'r', 'n', 'b', 'q', 'k'];
      const colors = ['w', 'b'];
      const themes = ['classic', 'marble', 'neon', 'wood'];

      // Test heights
      for (const t of pieceTypes) {
        const h = window.ChessPieces3D.getPieceHeight(t);
        assert(typeof h === 'number' && h > 0.8 && h < 2.5, 'Height for ' + t + ' is ' + h);
      }

      // Test mode switching
      assert(window.ChessPieces3D.getMode() === '3d', 'Default mode is 3d');
      window.ChessPieces3D.setMode('2d');
      assert(window.ChessPieces3D.getMode() === '2d', 'Mode switched to 2d');
      window.ChessPieces3D.setMode('3d');
      assert(window.ChessPieces3D.getMode() === '3d', 'Mode switched back to 3d');

      // Test 3D piece creations across all types, colors, themes
      for (const th of themes) {
        window.ChessPieces3D.setTheme(th);
        for (const c of colors) {
          for (const t of pieceTypes) {
            const piece = window.ChessPieces3D.createPieceMesh(t, c, th, '3d');
            assert(piece && piece.isGroup, 'Piece created for ' + t + '-' + c + '-' + th);
            assert(piece.children.length > 0, 'Piece has child meshes (' + piece.children.length + ')');
            assert(piece.userData.type === t, 'userData.type matches ' + t);
            assert(piece.userData.color === c, 'userData.color matches ' + c);
            assert(piece.userData.theme === th, 'userData.theme matches ' + th);
            assert(piece.userData.mode === '3d', 'userData.mode matches 3d');

            // Check shadow flags and inverted-hull outline
            let meshCount = 0;
            let outlineCount = 0;
            let feltCount = 0;
            piece.traverse((node) => {
              if (node.isMesh) {
                meshCount++;
                if (node.userData.isOutline) outlineCount++;
                if (node.userData.isFelt) feltCount++;
                assert(node.material && node.material.isMaterial, 'Mesh has valid material');
              }
            });
            assert(meshCount > 0, 'Found ' + meshCount + ' meshes in 3D ' + t);
            assert(outlineCount > 0, 'Found ' + outlineCount + ' outline meshes in 3D ' + t);
            assert(feltCount === 1, 'Found felt pad in 3D ' + t);

            // Check Knight orientation
            if (t === 'n') {
              if (c === 'b') {
                assert(Math.abs(piece.rotation.y - Math.PI) < 0.001, 'Black knight rotated PI');
              } else {
                assert(piece.rotation.y === 0, 'White knight rotation is 0');
              }
            }

            // Test updatePieceTheme on 3D piece
            window.ChessPieces3D.updatePieceTheme(piece, 'neon');
            assert(piece.userData.theme === 'neon', 'updatePieceTheme updated theme to neon');
          }
        }
      }

      // Test 2D procedural piece creation across all types, colors, themes
      window.ChessPieces3D.setMode('2d');
      for (const th of themes) {
        for (const c of colors) {
          for (const t of pieceTypes) {
            const piece2d = window.ChessPieces3D.createPieceMesh(t, c, th);
            assert(piece2d && piece2d.isGroup, '2D piece created for ' + t + '-' + c + '-' + th);
            assert(piece2d.userData.mode === '2d', '2D piece userData.mode is 2d');
            assert(piece2d.userData.is2D === true, '2D piece userData.is2D is true');
            assert(piece2d.userData.height === 0.04, '2D piece height is 0.04');

            let hasPuck = false, hasRing = false, hasFace = false, hasFelt = false;
            piece2d.traverse((node) => {
              if (node.isMesh) {
                if (node.userData.isPuck) hasPuck = true;
                if (node.userData.isRing) hasRing = true;
                if (node.userData.isFace) hasFace = true;
                if (node.userData.isFelt) hasFelt = true;
              }
            });
            assert(hasPuck, '2D piece has token puck');
            assert(hasRing, '2D piece has outer ring');
            assert(hasFace, '2D piece has vector face mesh');
            assert(hasFelt, '2D piece has base felt pad');

            // Test updatePieceTheme on 2D piece
            window.ChessPieces3D.updatePieceTheme(piece2d, 'wood');
            assert(piece2d.userData.theme === 'wood', 'updatePieceTheme updated 2D theme to wood');
          }
        }
      }

      document.getElementById('output').innerHTML = '<pre id="res">' + results.join('\n') + '\nALL 3D AND 2D TESTS PASSED SUCCESSFULLY!</pre>';
    } catch (e) {
      document.getElementById('output').innerHTML = '<pre id="res">' + results.join('\n') + '\nERROR: ' + e.message + '\n' + e.stack + '</pre>';
    }
  </script>
</body>
</html>
